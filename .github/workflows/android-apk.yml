name: Android APK

on:
  push:
    branches:
      - main
      - master
      - development
      - intlokitchen
  pull_request:
    branches:
      - main
      - master
      - development
      - intlokitchen
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.12674087" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release APK cannot be signed."
            exit 1
          fi
          if [ -z "$KEYSTORE_FILE" ] || [ -z "$KEY_ALIAS" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_FILE, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD must all be set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "android/app/$KEYSTORE_FILE"
          printf '\nMYAPP_UPLOAD_STORE_FILE=%s\nMYAPP_UPLOAD_KEY_ALIAS=%s\nMYAPP_UPLOAD_STORE_PASSWORD=%s\nMYAPP_UPLOAD_KEY_PASSWORD=%s\n' \
            "$KEYSTORE_FILE" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD" >> android/gradle.properties
          echo "Signing config restored for $KEYSTORE_FILE (alias $KEY_ALIAS)"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set. The build needs android/app/google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbundleDebugApk assembleDebug --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APKs to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
